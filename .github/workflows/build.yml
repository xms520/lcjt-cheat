name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: |
          brew install ldid 2>/dev/null || true
          if ! command -v ldid >/dev/null; then
            mkdir -p $HOME/bin
            curl -L -o $HOME/bin/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64
            chmod +x $HOME/bin/ldid
            echo "$HOME/bin" >> $GITHUB_PATH
          fi
          export PATH=$HOME/bin:$PATH
          ldid -h 2>&1 | head -3 || echo "ldid check skip"

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          [ -d $THEOS/sdks ] || git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          ls $THEOS/sdks

      - name: Build
        run: |
          make clean || true
          make package THEOS_PACKAGE_SCHEME=rootless SIDELOADING=1 FINALPACKAGE=1 2>&1 | tee build.log
          echo "=== deb ==="
          ls -la packages/ 2>/dev/null || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lcjt-package
          path: |
            packages/*.deb
            .theos/obj/**/*.dylib
            build.log
          if-no-files-found: warn
